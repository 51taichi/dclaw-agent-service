<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DClaw AI 客服管理后台</title>
    <link rel="icon" type="image/png" href="./assets/admin-favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./agent.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="admin-icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></symbol>
      <symbol id="admin-icon-bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 3v4M8 12h.01M16 12h.01M8 16h8"></path></symbol>
      <symbol id="admin-icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path></symbol>
      <symbol id="admin-icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
      <symbol id="admin-icon-save" viewBox="0 0 24 24"><path d="M4 4h14l2 2v14H4zM8 4v6h8V4M8 20v-6h8v6"></path></symbol>
      <symbol id="admin-icon-open" viewBox="0 0 24 24"><path d="M14 3h7v7M10 14 21 3M21 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h6"></path></symbol>
      <symbol id="admin-icon-power" viewBox="0 0 24 24"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0"></path></symbol>
      <symbol id="admin-icon-id" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8" cy="11" r="2"></circle><path d="M5.5 16a3 3 0 0 1 5 0M14 10h4M14 14h4"></path></symbol>
      <symbol id="admin-icon-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"></circle><path d="m11 12 9-9M15 7l2 2M17 5l2 2"></path></symbol>
      <symbol id="admin-icon-name" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h16"></path></symbol>
      <symbol id="admin-icon-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"></path></symbol>
      <symbol id="admin-icon-refresh" viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5M6.1 9A7 7 0 0 1 18 6l2 5M17.9 15A7 7 0 0 1 6 18l-2-5"></path></symbol>
    </svg>

    <header class="topbar admin-topbar">
      <div class="topbar-inner">
        <div class="brand"><img class="brand-logo" src="/console/assets/deepmega-dclaw-logo-cropped.png" alt="DeepMega DClaw" /><div class="brand-copy"><h1>DClaw AI 客服管理后台</h1></div></div>
        <a class="secondary console-link" href="/console/"><svg><use href="#admin-icon-open"></use></svg>打开管理中台</a>
      </div>
    </header>

    <main class="admin-page">
      <nav class="admin-tabs" aria-label="管理员功能">
        <button class="active" data-tab="channels"><svg><use href="#admin-icon-grid"></use></svg>渠道账号</button>
        <button data-tab="adapters"><svg><use href="#admin-icon-settings"></use></svg>Adapter 能力</button>
      </nav>

      <section class="admin-panel active" data-panel="channels">
        <div class="admin-panel-head"><h1>渠道账号</h1><button id="newAccountButton" class="secondary"><svg><use href="#admin-icon-plus"></use></svg>新增渠道</button></div>
        <div class="admin-workspace-layout">
          <aside id="accountList" class="admin-list"></aside>
          <div class="admin-detail">
            <form id="accountForm" class="admin-form">
              <label><span><svg><use href="#admin-icon-id"></use></svg>账号 ID</span><input name="id" required pattern="[a-z][a-z0-9-]{2,79}" /></label>
              <label><span><svg><use href="#admin-icon-settings"></use></svg>Adapter</span><select name="provider" required></select></label>
              <label><span><svg><use href="#admin-icon-name"></use></svg>显示名称</span><input name="name" required /></label>
              <label><span><svg><use href="#admin-icon-settings"></use></svg>品牌色</span><input name="accent" type="color" value="#2a30d8" /></label>
              <label class="admin-span-two"><span><svg><use href="#admin-icon-link"></use></svg>OpenAPI URL</span><input name="agentApiUrl" type="url" /></label>
              <label><span><svg><use href="#admin-icon-id"></use></svg>Agent ID</span><input name="agentId" /></label>
              <label><span><svg><use href="#admin-icon-key"></use></svg>OpenAPI Key</span><input name="agentApiKey" type="password" autocomplete="new-password" /></label>
              <label class="admin-span-two"><span><svg><use href="#admin-icon-key"></use></svg>Webhook Secret</span><input name="webhookSecret" type="password" autocomplete="new-password" /></label>
              <div class="admin-form-control-row admin-span-two">
                <label class="toggle-line admin-switch-field switch-toggle"><svg><use href="#admin-icon-power"></use></svg><span>启用渠道</span><input name="enabled" type="checkbox" checked /><span class="switch-slider"></span></label>
                <button class="primary" type="submit"><svg><use href="#admin-icon-save"></use></svg>保存渠道</button>
              </div>
            </form>
            <section id="endpointCard" class="endpoint-card" hidden><h2>渠道接入</h2><div><strong>接收消息</strong><code id="inboundEndpoint"></code></div><div><strong>拉取回复</strong><code id="outboxEndpoint"></code></div><div><strong>上报回执</strong><code id="receiptEndpoint"></code></div></section>
          </div>
        </div>
      </section>

      <section class="admin-panel" data-panel="adapters">
        <div class="admin-panel-head"><h1>Adapter 能力</h1><button id="refreshAdapters" class="secondary"><svg><use href="#admin-icon-refresh"></use></svg>刷新</button></div>
        <div id="adapterGrid" class="adapter-grid"></div>
      </section>
    </main>
    <div id="toast" class="admin-toast" hidden></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
