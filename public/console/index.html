<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DClaw AI 客服管理中台</title>
    <link rel="icon" type="image/png" href="./assets/console-favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./agent.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.1 6.6M3 12a9 9 0 0 1 15.1-6.6M18 2v4h-4M6 22v-4h4" /></symbol>
      <symbol id="icon-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2ZM17 21v-8H7v8M7 3v5h8" /></symbol>
      <symbol id="icon-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4ZM22 2 11 13" /></symbol>
      <symbol id="icon-message" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3v-7a4 4 0 0 1-1-2.7V7a4 4 0 0 1 4-4h11a4 4 0 0 1 4 4ZM7 8h10M7 12h7" /></symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></symbol>
      <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.1-1.1" /></symbol>
      <symbol id="icon-tag" viewBox="0 0 24 24"><path d="M20.6 13.5 13.5 20.6a2 2 0 0 1-2.8 0L3 12.9V4h8.9l8.7 8.7a2 2 0 0 1 0 2.8Z" /><circle cx="7.5" cy="7.5" r="1.5" /></symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></symbol>
      <symbol id="icon-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8" /></symbol>
      <symbol id="icon-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10" /></symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0ZM12 9v4M12 17h.01" /></symbol>
      <symbol id="icon-robot" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="10" rx="3" /><path d="M12 8V4M3 12h2M19 12h2M10 16h4" /><circle cx="12" cy="4" r="1.5" /><circle cx="9" cy="13" r="1" /><circle cx="15" cy="13" r="1" /></symbol>
      <symbol id="icon-cockpit" viewBox="0 0 24 24"><path d="M4 19a8 8 0 1 1 16 0m-8-4 4-4M7 19h10M12 7v2" /></symbol>
      <symbol id="icon-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" /><path d="M8 21h8M12 17v4" /></symbol>
      <symbol id="icon-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2" /><path d="M10 18h4" /></symbol>
      <symbol id="icon-code" viewBox="0 0 24 24"><path d="m8 9-3 3 3 3m8-6 3 3-3 3m-3-9-2 12" /></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
    </svg>

    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img class="brand-logo" src="./assets/deepmega-dclaw-logo-cropped.png" alt="DeepMega DClaw" />
          <div class="brand-copy"><h1>DClaw AI 客服管理中台</h1></div>
        </div>
        <div class="topbar-platforms" aria-label="支持渠道">
          <span class="platform-logo" aria-label="官网客服" title="官网客服"><svg class="icon"><use href="#icon-monitor"></use></svg></span>
          <span class="platform-logo" aria-label="微信小程序" title="微信小程序"><svg class="icon"><use href="#icon-phone"></use></svg></span>
          <a class="secondary admin-entry" href="/admin/" title="渠道管理"><svg class="icon"><use href="#icon-code"></use></svg></a>
        </div>
      </div>
    </header>

    <main class="layout console-shell">
      <div class="left-rail">
        <aside class="panel bot-sidebar">
          <div class="section-head">
            <h2 class="module-title"><svg class="icon"><use href="#icon-users"></use></svg>已配置渠道</h2>
            <span id="accountCount" class="muted"></span>
          </div>
          <div id="accountList" class="bot-list"></div>
        </aside>
      </div>

      <div class="workspace">
        <div class="workspace-head">
          <div class="workspace-tabs" role="tablist" aria-label="控制台模块">
            <button class="active" data-tab="cockpit" type="button"><svg class="icon"><use href="#icon-cockpit"></use></svg>驾驶舱</button>
            <button data-tab="sessions" type="button"><svg class="icon"><use href="#icon-users"></use></svg>会话</button>
            <button data-tab="flow" type="button"><svg class="icon"><use href="#icon-edit"></use></svg>状态机</button>
            <button data-tab="tags" type="button"><svg class="icon"><use href="#icon-tag"></use></svg>标签</button>
            <button data-tab="push" type="button"><svg class="icon"><use href="#icon-send"></use></svg>激活</button>
            <button data-tab="logs" type="button"><svg class="icon"><use href="#icon-eye"></use></svg>日志</button>
            <button data-tab="config" type="button"><svg class="icon"><use href="#icon-link"></use></svg>配置</button>
          </div>
          <div class="current-bot-actions">
            <button id="refreshButton" class="secondary" type="button"><svg class="icon"><use href="#icon-refresh"></use></svg>刷新</button>
          </div>
        </div>

        <section id="emptyState" class="workspace-empty-state" hidden>
          <div class="chat-loading-card workspace-empty-card">
            <img src="./assets/moosee-work-serious-scene.png" alt="" />
            <span><strong>暂无可用渠道</strong><small>请前往渠道管理创建并启用一个渠道</small></span>
          </div>
        </section>

        <div class="tab-panel" data-panel="cockpit">
          <section class="panel bot-context-panel cockpit-shell">
            <div class="cockpit-content">
              <div class="cockpit-heading">
                <span><small>当前渠道</small><strong id="cockpitTitle">经营驾驶舱</strong></span>
                <span id="healthPill" class="pill ok">运行正常</span>
              </div>
              <div id="metricGrid" class="cockpit-metric-grid"></div>
              <div class="agent-dashboard-grid">
                <section class="dashboard-band"><div class="section-head"><h2 class="module-title"><svg class="icon"><use href="#icon-edit"></use></svg>会话状态分布</h2></div><div id="stateBreakdown" class="state-breakdown"></div></section>
                <section class="dashboard-band"><div class="section-head"><h2 class="module-title"><svg class="icon"><use href="#icon-alert"></use></svg>待处理提醒</h2><button class="secondary compact-button" data-go-tab="sessions">进入会话</button></div><div id="dashboardAlerts" class="dashboard-alert-list"></div></section>
              </div>
            </div>
          </section>
        </div>

        <div class="tab-panel" data-panel="sessions" hidden>
          <section id="flowSessionsPanel" class="panel bot-context-panel">
            <div class="section-head flow-session-head">
              <div class="flow-session-filters session-filter-grid">
                <label class="flow-session-search"><span class="field-label"><svg class="icon"><use href="#icon-search"></use></svg>搜索客户</span><input id="conversationSearch" type="search" placeholder="搜索姓名或用户 ID" /></label>
                <label><span class="field-label"><svg class="icon"><use href="#icon-edit"></use></svg>会话状态</span><select id="conversationStateFilter"><option value="">全部状态</option></select></label>
                <label><span class="field-label"><svg class="icon"><use href="#icon-user"></use></svg>接待模式</span><select id="conversationModeFilter"><option value="">全部模式</option><option value="ai">AI 接待</option><option value="human">人工接待</option></select></label>
              </div>
              <button id="refreshConversations" class="secondary" type="button"><svg class="icon"><use href="#icon-refresh"></use></svg>刷新</button>
            </div>
            <div class="collapsible-content flow-workbench">
              <div class="flow-session-sidebar">
                <div class="segmented flow-session-type-tabs"><button class="active" type="button"><svg class="icon"><use href="#icon-user"></use></svg>客户会话</button><button id="openAlertFilter" type="button"><svg class="icon"><use href="#icon-alert"></use></svg>待处理</button></div>
                <div id="conversationList" class="flow-session-list"></div>
                <div id="conversationSummary" class="pagination-bar"></div>
              </div>
              <div class="chat-view">
                <div class="chat-head">
                  <div class="chat-title-wrap"><img class="chat-title-avatar" src="./assets/bot-avatar.png" alt="" /><strong id="chatTitle">请选择一个会话</strong><span id="chatTags" class="chat-tag-list conversation-metadata-flow"></span></div>
                  <div class="chat-head-actions">
                    <label class="chat-state-select"><span>状态</span><select id="chatState" disabled></select></label>
                    <span id="handoffSwitch" class="handoff-switch conversation-handoff-switch" role="switch" tabindex="0" aria-checked="false" title="切换 AI / 人工接待" hidden><span class="handoff-switch-option is-ai"><svg class="icon"><use href="#icon-robot"></use></svg></span><span class="handoff-switch-option is-human"><svg class="icon"><use href="#icon-user"></use></svg></span><span class="handoff-switch-thumb"></span></span>
                  </div>
                </div>
                <div id="chatMessages" class="chat-messages"><div class="empty-state">请选择左侧客户会话</div></div>
                <form id="manualReplyComposer" class="manual-reply-composer is-ai" hidden>
                  <div class="ai-takeover-card"><img src="./assets/ai-chatting.png" alt="" /><div class="ai-takeover-copy"><span>AI 正在和客户沟通中</span><small>AI is chatting with the customer</small></div></div>
                  <div class="manual-reply-box" hidden><textarea id="manualReplyInput" rows="3" placeholder="输入人工回复"></textarea><div class="manual-reply-tools"><span class="muted">消息将通过当前渠道 Adapter 投递</span><button class="primary" type="submit"><svg class="icon"><use href="#icon-send"></use></svg>发送</button></div></div>
                </form>
              </div>
            </div>
          </section>
        </div>

        <div class="tab-panel" data-panel="flow" hidden>
          <section class="panel bot-context-panel editor-panel">
            <div class="section-head"><h2 class="module-title"><svg class="icon"><use href="#icon-edit"></use></svg>会话状态机</h2><button id="addStateButton" class="secondary" type="button"><svg class="icon"><use href="#icon-plus"></use></svg>新增状态</button></div>
            <form id="stateMachineForm"><div id="stateEditor" class="state-editor"></div><div class="actions sticky-actions"><button class="primary" type="submit"><svg class="icon"><use href="#icon-save"></use></svg>保存状态机</button></div></form>
          </section>
        </div>

        <div class="tab-panel" data-panel="tags" hidden>
          <section class="panel bot-context-panel editor-panel">
            <div class="section-head"><h2 class="module-title"><svg class="icon"><use href="#icon-tag"></use></svg>标签体系</h2></div>
            <form id="tagForm" class="inline-create-form"><label><span class="field-label">标签名称</span><input name="name" required maxlength="60" /></label><label><span class="field-label">颜色</span><input name="color" type="color" value="#2a30d8" /></label><label class="grow"><span class="field-label">业务含义</span><input name="description" maxlength="300" /></label><button class="primary" type="submit"><svg class="icon"><use href="#icon-plus"></use></svg>新增</button></form>
            <div id="tagList" class="tag-definition-grid"></div>
          </section>
        </div>

        <div class="tab-panel" data-panel="push" hidden>
          <section class="panel bot-context-panel editor-panel">
            <div class="section-head"><h2 class="module-title"><svg class="icon"><use href="#icon-send"></use></svg>会话激活</h2></div>
            <form id="activationForm" class="activation-layout"><div><label class="field-stack"><span class="field-label">选择目标会话</span><div id="activationTargets" class="target-list"></div></label></div><label class="field-stack"><span class="field-label">发送内容</span><textarea name="content" rows="8" required placeholder="输入要发送给所选客户的消息"></textarea></label><div class="actions"><button class="primary" type="submit"><svg class="icon"><use href="#icon-send"></use></svg>立即发送</button></div></form>
          </section>
        </div>

        <div class="tab-panel" data-panel="logs" hidden>
          <section class="panel bot-context-panel editor-panel"><div class="section-head"><h2 class="module-title"><svg class="icon"><use href="#icon-eye"></use></svg>运行审计</h2><button id="refreshAudit" class="secondary"><svg class="icon"><use href="#icon-refresh"></use></svg>刷新</button></div><div id="auditList" class="audit-list"></div></section>
        </div>

        <div class="tab-panel" data-panel="config" hidden>
          <section class="panel bot-context-panel editor-panel">
            <div class="section-head"><h2 class="module-title"><svg class="icon"><use href="#icon-link"></use></svg>Agent Gateway 与渠道配置</h2><a href="/admin/" class="secondary"><svg class="icon"><use href="#icon-code"></use></svg>渠道管理</a></div>
            <form id="accountForm" class="form-grid compact-form account-config-form">
              <label><span class="field-label">渠道名称</span><input name="name" required /></label>
              <label><span class="field-label">品牌色</span><input name="accent" type="color" /></label>
              <label class="wide"><span class="field-label">DClaw OpenAPI URL</span><input name="agentApiUrl" type="url" placeholder="https://.../openapi/chat" /></label>
              <label><span class="field-label">Agent ID</span><input name="agentId" /></label>
              <label><span class="field-label">OpenAPI API Key</span><input name="agentApiKey" type="password" autocomplete="new-password" placeholder="未修改则保留原值" /></label>
              <label class="wide"><span class="field-label">Webhook Secret</span><input name="webhookSecret" type="password" autocomplete="new-password" placeholder="可选；设置后入口需传 X-Channel-Secret" /></label>
              <label class="toggle switch-toggle"><input name="enabled" type="checkbox" /><span class="switch-slider"></span><span class="switch-label">启用渠道</span></label>
              <div class="integration-endpoints wide"><strong>接入地址</strong><code id="inboundEndpoint"></code><strong>消息拉取</strong><code id="outboxEndpoint"></code></div>
              <div class="actions wide"><button class="primary" type="submit"><svg class="icon"><use href="#icon-save"></use></svg>保存配置</button></div>
            </form>
          </section>
        </div>
      </div>
    </main>

    <div id="alertCenter" class="tag-alert-center">
      <div id="alertPanel" class="tag-alert-panel" hidden><div class="tag-alert-panel-head"><strong>待处理提醒</strong><button id="closeAlerts" class="icon-button secondary"><svg class="icon"><use href="#icon-chevron"></use></svg></button></div><div id="alertList" class="tag-alert-list"></div></div>
      <button id="alertButton" class="tag-alert-button" type="button" aria-label="待处理提醒"><svg class="icon"><use href="#icon-alert"></use></svg><span id="alertCount" class="tag-alert-count">0</span></button>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
