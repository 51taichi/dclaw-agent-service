name: dclaw-agent-local

services:
  asr:
    build:
      context: ./asr
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: dclaw-asr:local
    container_name: dclaw-asr-local
    init: true
    restart: unless-stopped
    environment:
      ASR_MODEL: ${SPEECH_MODEL:-small}
      ASR_DEVICE: cpu
      ASR_COMPUTE_TYPE: int8
      ASR_CPU_THREADS: ${DCLAW_ASR_CPU_THREADS:-2}
      ASR_BEAM_SIZE: ${DCLAW_ASR_BEAM_SIZE:-5}
      ASR_DOWNLOAD_ROOT: /models/faster-whisper
      HF_HOME: /models/huggingface
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    ports:
      - "127.0.0.1:${DCLAW_ASR_PORT:-18000}:8000"
    volumes:
      - dclaw-asr-models:/models
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: ${DCLAW_ASR_CPUS:-2.0}
    mem_limit: ${DCLAW_ASR_MEMORY_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10m

  agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: dclaw-agent-service:local
    container_name: dclaw-agent-service-local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4310
      DATABASE_PATH: /app/data/dclaw-agent.sqlite
      PUBLIC_BASE_URL: ${DCLAW_AGENT_PUBLIC_BASE_URL:-http://127.0.0.1:${DCLAW_AGENT_PORT:-4310}}
      AGENT_TIMEOUT_MS: ${AGENT_TIMEOUT_MS:-90000}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-3}
      ADMIN_AUTH_REQUIRED: ${ADMIN_AUTH_REQUIRED:-false}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-12}
      SPEECH_API_URL: ${SPEECH_API_URL:-http://asr:8000/v1/audio/transcriptions}
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
      SPEECH_MODEL: ${SPEECH_MODEL:-small}
      SPEECH_LANGUAGE: ${SPEECH_LANGUAGE:-zh}
      SPEECH_TIMEOUT_MS: ${SPEECH_TIMEOUT_MS:-60000}
    depends_on:
      asr:
        condition: service_healthy
    ports:
      - "${DCLAW_AGENT_PORT:-4310}:4310"
    volumes:
      - dclaw-agent-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4310/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s

volumes:
  dclaw-agent-data:
    name: dclaw-agent-service-data
  dclaw-asr-models:
    name: dclaw-agent-service-asr-models
